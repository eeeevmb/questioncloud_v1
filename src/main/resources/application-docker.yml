spring:
  application:
    name: questioncloud

  datasource:
    url: jdbc:mysql://mysql:3306/questioncloud_db?serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: questioncloud
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${RABBITMQ_DEFAULT_USER}
    password: ${RABBITMQ_DEFAULT_PASS}
    virtual-host: /

  data:
    redis:
      host: redis
      port: 6379
      timeout: 3s

  mail:
    host: ${QC_SMTP_HOST:smtp.qq.com}
    port: ${QC_SMTP_PORT:465}
    username: ${QC_SMTP_USERNAME:}
    password: ${QC_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${QC_SMTP_AUTH:true}
          ssl:
            enable: ${QC_SMTP_SSL_ENABLE:true}
            socketFactory:
              class: javax.net.ssl.SSLSocketFactory
              port: ${QC_SMTP_PORT:465}
        transport:
          protocol: smtp

langchain4j:
  community:
    dashscope:
      chat-model:
        api-key: ${DASHSCOPE_API_KEY:}
        model-name: qwen-plus
      streaming-chat-model:
        api-key: ${DASHSCOPE_API_KEY:}
        model-name: qwen-plus
      embedding-model:
        api-key: ${DASHSCOPE_API_KEY:}
        model-name: text-embedding-v4

chroma:
  base-url: ${CHROMA_BASE_URL:http://chroma:8000}
  collection: questions
  api-version: V2
  log-requests: true
  log-responses: true

server:
  port: 8080

sa-token:
  token-name: satoken
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: true

file:
  storage:
    local:
      base-path: /data/questioncloud-storage
    quota:
      enabled: true
      files-per-week: 50
  upload:
    allowed-image-extensions: [jpg, jpeg, png]
    allowed-doc-extensions: [doc, docx, pdf, tex]
