spring:
  application:
    name: questioncloud

  datasource:
    url: jdbc:mysql://mysql:3306/questioncloud_db?serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: questioncloud
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${RABBITMQ_DEFAULT_USER}
    password: ${RABBITMQ_DEFAULT_PASS}
    virtual-host: /

  data:
    redis:
      host: redis
      port: 6379
      timeout: 3s

server:
  port: 8080

sa-token:
  token-name: satoken
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: true

file:
  storage:
    local:
      base-path: /data/questioncloud-storage
    quota:
      enabled: true
      files-per-week: 50
  upload:
    allowed-image-extensions: [jpg, jpeg, png]
    allowed-doc-extensions: [doc, docx, pdf, tex]