    name: questioncloud
  datasource:
    url: jdbc:mysql://localhost:3306/questioncloud_demo_db?serverTimezone=Asia/Shanghai
    username: root
    password: 861007889
    driver-class-name: com.mysql.cj.jdbc.Driver
  ai:
    dashscope:
      api-key: sk-b3c6fffb6266416abbc611c80ba79e3b
  servlet:
    multipart:
      enabled: true
