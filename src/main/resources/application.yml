    base-path: /Users/evmb/question-cloud-storage
    avatar:
      path: ${file.upload.base-path}/avatars
      max-size: 20MB
      allowed-types:
        - image/jpeg
        - image/png
        - image/gif
    question:
      path: ${file.upload.base-path}/questions
      max-size: 10MB
      allowed-types:
        - image/jpeg
        - image/png