spring:
  application:
    name: questioncloud
  profiles:
    active: local # 默认启用本地配置文件
  datasource:
    url: jdbc:mysql://localhost:3306/questioncloud_db?serverTimezone=Asia/Shanghai
    username: root
    password: # CHANGE_ME
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: admin
    password: admin
    virtual-host: /
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 3s
  mail:
    host: smtp.qq.com
    port: 465
    username: # CHANGE_ME  用于测试发送邮件的邮箱，未来会改为系统邮箱地址
    password: # CHANGE_ME  SMTP授权码
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
            port: 465
        transport:
          protocol: smtp
  #        debug: true

langchain4j:
  community:
    dashscope:
      chat-model:
        api-key: ${DASHSCOPE_API_KEY:}
        model-name: deepseek-v3.1
      streaming-chat-model:
        api-key: ${DASHSCOPE_API_KEY:}
        model-name: deepseek-v3.1
      embedding-model:
        api-key: ${DASHSCOPE_API_KEY:}
        model-name: text-embedding-v4
  open-ai:
    chat-model:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: https://api.deepseek.com
      model-name: deepseek-v4-flash
      max-tokens: 1024
      custom-parameters:
        thinking:
          type: disabled

chroma:
  base-url: ${CHROMA_BASE_URL:http://127.0.0.1:8000}
  collection: questions
  api-version: V2
  log-requests: true
  log-responses: true

sa-token:
  token-name: satoken
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: true

file:
  storage:
    # 本地存储配置
    local:
      # 文件存储的基础路径。可以是绝对路径 (e.g., /var/files) 或相对路径 (e.g., uploads)。
      # 相对路径将以项目运行目录为基准。
      base-path: uploads
    # 配额配置
    quota:
      # 是否启用配额检查
      enabled: true
      # 每个用户每周允许上传的文件数量
      files-per-week: 50
  upload:
    allowed-image-extensions:
      - jpg
      - jpeg
      - png
    allowed-doc-extensions:
      - doc
      - docx
      - pdf
      - tex
