services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${QC_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: questioncloud_db
      MYSQL_USER: questioncloud
      MYSQL_PASSWORD: ${QC_MYSQL_PASSWORD}
    volumes:
      - ./src/main/resources/sql/question_domain.sql:/docker-entrypoint-initdb.d/01_question_domain.sql:ro
      - ./src/main/resources/sql/exam_domain.sql:/docker-entrypoint-initdb.d/02_exam_domain.sql:ro
      - ./src/main/resources/sql/infra_file.sql:/docker-entrypoint-initdb.d/03_infra_file.sql:ro
      - ./src/main/resources/sql/user.sql:/docker-entrypoint-initdb.d/04_user.sql:ro
      - ./src/main/resources/sql/agent_domain.sql:/docker-entrypoint-initdb.d/05_agent_domain.sql:ro
      - ./src/main/resources/sql/init_agent.sql:/docker-entrypoint-initdb.d/06_init_agent.sql:ro
      - qc_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - qc_redis_data:/data

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${QC_RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${QC_RABBITMQ_PASS}

  chroma:
    image: chromadb/chroma:latest
    restart: unless-stopped
    volumes:
      - qc_chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/api/v1/heartbeat >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      chroma:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_PASSWORD: ${QC_MYSQL_PASSWORD}
      RABBITMQ_DEFAULT_USER: ${QC_RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${QC_RABBITMQ_PASS}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      CHROMA_BASE_URL: http://chroma:8000
      QC_SMTP_HOST: ${QC_SMTP_HOST:-smtp.qq.com}
      QC_SMTP_PORT: ${QC_SMTP_PORT:-465}
      QC_SMTP_USERNAME: ${QC_SMTP_USERNAME:-}
      QC_SMTP_PASSWORD: ${QC_SMTP_PASSWORD:-}
      QC_SMTP_AUTH: ${QC_SMTP_AUTH:-true}
      QC_SMTP_SSL_ENABLE: ${QC_SMTP_SSL_ENABLE:-true}
    ports:
      - "${QC_BACKEND_PORT}:8080"
    volumes:
      - qc_storage:/data/questioncloud-storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${QC_FRONTEND_PORT}:80"

volumes:
  qc_mysql_data:
  qc_redis_data:
  qc_storage:
  qc_chroma_data:
