services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${QC_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: questioncloud_db
      MYSQL_USER: questioncloud
      MYSQL_PASSWORD: ${QC_MYSQL_PASSWORD}
    volumes:
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - qc_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - qc_redis_data:/data

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${QC_RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${QC_RABBITMQ_PASS}

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_PASSWORD: ${QC_MYSQL_PASSWORD}
      RABBITMQ_DEFAULT_USER: ${QC_RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${QC_RABBITMQ_PASS}
    ports:
      - "${QC_BACKEND_PORT}:8080"
    volumes:
      - qc_storage:/data/questioncloud-storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${QC_FRONTEND_PORT}:80"

volumes:
  qc_mysql_data:
  qc_redis_data:
  qc_storage:
